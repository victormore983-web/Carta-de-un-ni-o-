<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para ti, Mamá — Noche Mágica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020206;
            font-family: 'Montserrat', sans-serif;
        }

        /* 3D Parallax viewport perspective container */
        .parallax-wrapper {
            position: absolute;
            inset: -4%;
            width: 108%;
            height: 108%;
            will-change: transform;
            transition: transform 0.15s ease-out;
        }

        /* Fullscreen background image setup */
        .bg-custom-image {
            background-image: url('fondo.jpg'), url('33447.jpg');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Soft vignette atmosphere overlay */
        .vignette-overlay {
            background: radial-gradient(circle at 50% 35%, rgba(2, 2, 8, 0.02) 0%, rgba(2, 2, 8, 0.4) 70%, rgba(1, 1, 5, 0.75) 100%);
        }

        /* Pulsing Moon Aura Effect */
        .moon-aura-glow {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(255, 245, 220, 0.18) 40%, rgba(255, 255, 255, 0) 72%);
            animation: moonPulse 5.5s ease-in-out infinite alternate;
            mix-blend-mode: screen;
            filter: blur(14px);
            pointer-events: none;
        }

        @keyframes moonPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.88);
                opacity: 0.55;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.22);
                opacity: 0.92;
            }
        }

        /* Night Mist / Fog Layer over bottom grass */
        .night-fog-layer {
            position: absolute;
            bottom: -20px;
            left: -20%;
            width: 140%;
            height: 220px;
            background: radial-gradient(ellipse at bottom, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.45) 50%, rgba(0, 0, 0, 0) 80%);
            animation: fogDrift 24s ease-in-out infinite alternate;
            pointer-events: none;
            filter: blur(22px);
            mix-blend-mode: screen;
        }

        @keyframes fogDrift {
            0% { transform: translateX(-5%) translateY(0); opacity: 0.6; }
            50% { transform: translateX(5%) translateY(-10px); opacity: 0.85; }
            100% { transform: translateX(-3%) translateY(5px); opacity: 0.65; }
        }

        /* Continuous rising emotional texts styling */
        .floating-text-item {
            position: absolute;
            bottom: -30px;
            font-size: 13px;
            line-height: 1.4;
            letter-spacing: 0.06em;
            color: rgba(245, 245, 255, 0.88);
            font-style: italic;
            font-weight: 300;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.75),
                0 0 16px rgba(255, 255, 255, 0.4),
                0 2px 5px rgba(0, 0, 0, 0.95);
            will-change: transform, opacity;
        }

        @media (min-width: 640px) {
            .floating-text-item {
                font-size: 15px;
            }
        }

        /* Upward floating animation to the top */
        @keyframes floatToTopSlowly {
            0% {
                transform: translateY(0) scale(0.95);
                opacity: 0;
            }
            8% {
                opacity: 0.95;
                transform: translateY(-8vh) scale(1);
            }
            85% {
                opacity: 0.82;
            }
            100% {
                transform: translateY(-104vh) scale(1.02);
                opacity: 0;
            }
        }

        .animate-float-up {
            animation: floatToTopSlowly 16s linear forwards;
        }

        /* Discreet Corner Dedication */
        .fixed-dedication {
            position: absolute;
            bottom: 16px;
            right: 20px;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
            font-weight: 300;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(255,255,255,0.3);
            z-index: 30;
            pointer-events: none;
        }

        /* Audio prompt indicator on startup */
        .audio-start-prompt {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 40;
        }
    </style>
</head>
<body class="h-full w-full relative bg-black overflow-hidden touch-none cursor-pointer">

    <!-- Reproductor de Audio Real -->
    <audio id="bgAudio" src="aquel niño.mp3" preload="auto" loop></audio>

    <!-- 3D Parallax Container -->
    <div id="parallaxContainer" class="parallax-wrapper bg-custom-image">
        <!-- Dark atmosphere layer -->
        <div class="absolute inset-0 vignette-overlay pointer-events-none"></div>

        <!-- Pulsing Moon Glow Aura centered at top -->
        <div class="moon-aura-glow"></div>

        <!-- Drifting Night Mist Layer -->
        <div class="night-fog-layer"></div>

        <!-- Canvas for celestial twinkling stars, golden sparkles, and red rose petals -->
        <canvas id="skyCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

        <!-- Container for automatic continuous floating texts -->
        <div id="textContainer" class="absolute inset-0 z-20 pointer-events-none overflow-hidden"></div>
    </div>

    <!-- Soft Audio Prompt Indicator -->
    <div id="audioPrompt" class="audio-start-prompt">
        ✨ Toca la pantalla para escuchar la música CREADOR VICPERSI✨
    </div>

    <!-- Fixed Discreet Corner Dedication -->
    <div class="fixed-dedication">
        Para ti, mamá — Creador :🤍 VIC 🤍 PERSI 🤍
    </div>

    <script>
        const SAD_MOTHER_PHRASES = [
            "Te extraño tanto, mamá...",
            "Aún miro al cielo buscándote.",
            "Un pedazo de mí se fue contigo.",
            "Ojalá pudiera abrazarte una vez más.",
            "Tu recuerdo sigue vivo en mi corazón.",
            "Me haces mucha falta, madre.",
            "En mis sueños aún me cuidas.",
            "Nunca te olvidaré, mamá.",
            "Daría todo por escuchar tu voz...",
            "Te llevo en cada latido.",
            "Siempre serás mi luz en la oscuridad.",
            "Un beso hasta el cielo...",
            "Tu amor es mi refugio eterno.",
            "Mami, me haces tanta falta...",
            "Espero volverte a ver algún día.",
            "Sigues siendo mi estrella favorita.",
            "Tu ausencia aún me duele tanto...",
            "Gracias por todo lo que me diste.",
            "Cuídame siempre desde el cielo.",
            "Te amo por siempre, mamá."
           
        ];

        let phraseQueue = [...SAD_MOTHER_PHRASES];
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        const textContainer = document.getElementById('textContainer');
        const parallaxContainer = document.getElementById('parallaxContainer');
        const audioPrompt = document.getElementById('audioPrompt');
        const bgAudio = document.getElementById('bgAudio');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let stars = [];
        let particles = [];
        let petals = [];

        // Función para iniciar la canción al tocar
        function playAudioTrack() {
            if (bgAudio && bgAudio.paused) {
                bgAudio.play().then(() => {
                    if (audioPrompt) {
                        audioPrompt.style.opacity = '0';
                        setTimeout(() => audioPrompt.remove(), 1600);
                    }
                }).catch(err => {
                    console.log("Error al reproducir audio:", err);
                });
            }
        }

        let targetTiltX = 0;
        let targetTiltY = 0;
        let currentTiltX = 0;
        let currentTiltY = 0;

        function handleMouseMove(e) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            targetTiltX = (e.clientX - cx) / cx * 6;
            targetTiltY = (e.clientY - cy) / cy * -6;
        }

        function handleDeviceOrientation(e) {
            if (e.beta !== null && e.gamma !== null) {
                targetTiltX = Math.min(Math.max(e.gamma / 3.5, -8), 8);
                targetTiltY = Math.min(Math.max((e.beta - 40) / 3.5, -8), 8);
            }
        }

        window.addEventListener('mousemove', handleMouseMove);
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        }

        function updateParallax() {
            currentTiltX += (targetTiltX - currentTiltX) * 0.06;
            currentTiltY += (targetTiltY - currentTiltY) * 0.06;

            if (parallaxContainer) {
                parallaxContainer.style.transform = `perspective(1000px) rotateY(${currentTiltX}deg) rotateX(${currentTiltY}deg) scale(1.04)`;
            }
            requestAnimationFrame(updateParallax);
        }

        class CelestialStar {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + Math.random() * 20;
                this.radius = Math.random() * 1.8 + 0.4;
                this.speedY = -(Math.random() * 0.3 + 0.08);
                this.speedX = (Math.random() - 0.5) * 0.12;
                this.baseAlpha = Math.random() * 0.5 + 0.35;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.03 + 0.01;
                this.twinkleAngle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                this.twinkleAngle += this.twinkleSpeed;
                this.alpha = this.baseAlpha + Math.sin(this.twinkleAngle) * 0.3;

                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0.1, Math.min(1, this.alpha));
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "#FDE68A";
                ctx.shadowBlur = this.radius * 3.5;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class GoldenSparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.2 + 0.8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 0.6;
                this.radius = Math.random() * 2.2 + 0.8;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = "#FDE68A";
                ctx.shadowColor = "#F59E0B";
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingRosePetal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 4;
                this.vx = (Math.random() - 0.5) * 1.8;
                this.vy = Math.random() * 1.4 + 0.6;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.04;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.005;
            }

            update() {
                this.x += this.vx + Math.sin(this.y * 0.02) * 0.4;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                ctx.fillStyle = "#E11D48";
                ctx.shadowColor = "#9F1239";
                ctx.shadowBlur = 6;
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.bezierCurveTo(this.size, -this.size / 2, this.size, this.size / 2, 0, this.size);
                ctx.bezierCurveTo(-this.size, this.size / 2, -this.size, -this.size / 2, 0, -this.size);
                ctx.fill();
                ctx.restore();
            }
        }

        function initStarfield() {
            stars = [];
            const starCount = Math.min(Math.floor((width * height) / 3600), 260);
            for (let i = 0; i < starCount; i++) {
                stars.push(new CelestialStar());
            }
        }

        function getNextPhrase() {
            if (phraseQueue.length === 0) {
                phraseQueue = [...SAD_MOTHER_PHRASES].sort(() => Math.random() - 0.5);
            }
            return phraseQueue.pop();
        }

        function spawnFloatingText(customX = null) {
            const textEl = document.createElement('div');
            textEl.className = 'floating-text-item animate-float-up';
            textEl.textContent = `"${getNextPhrase()}"`;

            const padding = 25;
            const screenWidth = window.innerWidth;
            let randomX;

            if (customX !== null) {
                randomX = Math.max(padding, Math.min(screenWidth - 220, customX - 80));
            } else {
                randomX = Math.random() * (screenWidth - 240) + padding;
            }

            textEl.style.left = `${randomX}px`;

            const duration = Math.random() * 5 + 14;
            textEl.style.animationDuration = `${duration}s`;

            textContainer.appendChild(textEl);

            setTimeout(() => {
                if (textEl && textEl.parentNode) {
                    textEl.parentNode.removeChild(textEl);
                }
            }, duration * 1000 + 100);
        }

        function startAutomaticTextStream() {
            spawnFloatingText();
            setTimeout(() => spawnFloatingText(), 1600);
            setTimeout(() => spawnFloatingText(), 3400);

            function scheduleNext() {
                const nextInterval = Math.random() * 1600 + 2200;
                setTimeout(() => {
                    spawnFloatingText();
                    scheduleNext();
                }, nextInterval);
            }
            scheduleNext();
        }

        function handleInteraction(clientX, clientY) {
            playAudioTrack();

            for (let i = 0; i < 16; i++) {
                particles.push(new GoldenSparkle(clientX, clientY));
            }

            for (let i = 0; i < 5; i++) {
                petals.push(new FloatingRosePetal(clientX + (Math.random() - 0.5) * 30, clientY));
            }

            spawnFloatingText(clientX);
        }

        window.addEventListener('pointerdown', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStarfield();
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            for (let i = petals.length - 1; i >= 0; i--) {
                petals[i].update();
                petals[i].draw();
                if (petals[i].alpha <= 0) {
                    petals.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            initStarfield();
            animate();
            updateParallax();
            startAutomaticTextStream();
        };
    </script>
</body>
</html>
